name: Release

# Every push to master whose manifest version has no release yet runs the
# tests and publishes one: tag vX.Y.Z, generated notes, pveupdate.zip attached.
# HACS offers these releases. Merges that don't change the version publish nothing.
on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read manifest version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("custom_components/pveupdate/manifest.json"))["version"])')
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released, nothing to do"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - if: steps.version.outputs.new == 'true'
        run: pip install -r requirements_test.txt && pytest
      - if: steps.version.outputs.new == 'true'
        name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd custom_components/pveupdate && zip -r ../../pveupdate.zip . -x '__pycache__/*')
          gh release create "${{ steps.version.outputs.tag }}" --target "$GITHUB_SHA" --generate-notes pveupdate.zip
