name: Release

# Publishing a release on GitHub (tag vX.Y.Z) runs the checks again and
# attaches the integration as a zip. HACS installs from these releases.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 -c 'import json; print(json.load(open("custom_components/pveupdate/manifest.json"))["version"])')
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: pytest
      - name: Attach zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd custom_components/pveupdate
          zip -r ../../pveupdate.zip . -x '__pycache__/*'
          cd ../..
          gh release upload "$GITHUB_REF_NAME" pveupdate.zip --clobber
